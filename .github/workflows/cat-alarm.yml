name: Build Cat Alarm APK

on:
  push:
    paths:
      - "CatAlarm/**"
      - ".github/workflows/cat-alarm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: CatAlarm
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CatAlarm.apk

      - name: Pack APK into RAR
        working-directory: CatAlarm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rar
          rar a -ep CatAlarm.rar CatAlarm.apk
          rar t CatAlarm.rar

      - uses: actions/upload-artifact@v4
        with:
          name: CatAlarm-apk
          path: |
            CatAlarm/CatAlarm.apk
            CatAlarm/CatAlarm.rar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cat-alarm-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Oliver - build ${{ github.run_number }}"
          body: |
            הורידו את `CatAlarm.apk` והתקינו בטלפון אנדרואיד (8.1 ומעלה).
            `CatAlarm.rar` מכיל את אותו APK, ארוז ב-RAR.
          files: |
            CatAlarm/CatAlarm.apk
            CatAlarm/CatAlarm.rar
          make_latest: true
