name: Build Cat Alarm APK

on:
  push:
    paths:
      - "CatAlarm/**"
      - ".github/workflows/cat-alarm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: CatAlarm
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CatAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CatAlarm-apk
          path: CatAlarm/CatAlarm.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cat-alarm-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "😼 החתול המעורר - build ${{ github.run_number }}"
          body: |
            הורידו את `CatAlarm.apk` והתקינו בטלפון אנדרואיד (8.1 ומעלה).
          files: CatAlarm/CatAlarm.apk
          make_latest: true
