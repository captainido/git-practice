<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>החתול שלי</title>
<style>
@font-face{font-family:'Rubik';font-weight:400 800;font-display:block;src:url(rubik-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:400 800;font-display:block;src:url(rubik-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF}
:root{
  --navy:#0e2240; --navy2:#173a66; --glass:rgba(14,34,64,.86); --cyan:#6fe0ff; --gold:#d9b25f; --gold2:#f6e1a1;
  --ink:#fff; --muted:#a9bfdc; --good:#5ee05a; --warn:#ffcf3a; --bad:#ff4d4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--ink);font-family:'Rubik',system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.15em;background:radial-gradient(circle at 35% 30%,#fff6c8 0 12%,#f3cf6a 30%,#c8952c 75%,#9b6d17);box-shadow:inset 0 0 0 1.5px #b07f22;position:relative}
.coin::after{content:"✦";position:absolute;inset:0;font-size:.6em;display:grid;place-items:center;color:#8a5f12}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#0b1b34,#12294b);border-bottom:1px solid #d9b25f55;position:relative;z-index:40}
#queue{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#qRing{width:42px;height:42px;border-radius:50%;padding:3px;background:conic-gradient(var(--cyan) calc(var(--p,0)*1%),#ffffff22 0);flex:0 0 auto;box-shadow:0 0 0 1px #d9b25f88}
#qIcon{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2f5d93,#122c51);display:grid;place-items:center;font-size:20px}
#qText{min-width:0}
#qLabel{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-size:11px;color:var(--muted);font-weight:500}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid #d9b25f88;background:linear-gradient(180deg,#24497a,#122c51);font-size:19px;position:relative;box-shadow:inset 0 1px 0 #ffffff33,0 2px 6px #0006}
.tbtn:active{transform:scale(.92)}
.badge{position:absolute;top:-5px;left:-5px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;font-weight:800;display:none;text-align:center;box-shadow:0 0 0 2px #0e2240}

/* ---------- scene ---------- */
#scene{position:relative;flex:1;overflow:hidden;touch-action:none;background:#0b1b34}
#stage{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#front{pointer-events:none;z-index:7}
[data-obj]{cursor:pointer}
.glowSpot{animation:spot 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spot{50%{opacity:.25}}
.night .daySky,.day .nightSky{display:none}
.night .lampGlow{opacity:1}
.lampGlow{opacity:.35;transition:opacity 1s}
#light{position:absolute;inset:0;pointer-events:none;z-index:8;transition:background 1s}
.day #light{background:radial-gradient(ellipse at 30% 10%,#fff3d433,transparent 60%),linear-gradient(180deg,transparent 60%,#0002)}
.night #light{background:radial-gradient(ellipse at 50% 18%,#ffcf7a30,transparent 45%),linear-gradient(#0a1440aa,#0a144077)}
#dark{position:absolute;inset:0;background:radial-gradient(circle at 80% 55%,#ffcf7a22,#050a22dd 50%);opacity:0;pointer-events:none;transition:opacity 1.4s;z-index:9}
#dark.on{opacity:1}

/* cat */
#cat{position:absolute;aspect-ratio:611/1100;transform:translateX(-50%);z-index:5;touch-action:none;transition:left .9s ease-in-out,bottom .9s ease-in-out,height .9s ease-in-out}
#catInner{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
#catImg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 8px 6px #0005) saturate(1.05)}
#cat .shadow{position:absolute;bottom:-4%;left:2%;right:2%;height:8%;background:radial-gradient(#0006,transparent 70%);z-index:-1}
.lid{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#c3c7cf 0 55%,#b4b8c1 70%,#b4b8c100 76%);transform:scaleY(0);transform-origin:50% 20%;transition:transform .12s}
.lid::after{content:"";position:absolute;left:12%;right:12%;top:46%;height:28%;border-bottom:3px solid #4a4a55;border-radius:0 0 50% 50%}
#lidL{left:42.7%;top:17.2%;width:13.4%;height:5.6%}
#lidR{left:71.1%;top:19.9%;width:11.1%;height:5.3%}
#cat.blink .lid,#cat.closed .lid{transform:scaleY(1)}
#acc{position:absolute;pointer-events:none;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 2px 2px #0005)}
#gem{position:absolute;left:58%;top:-17%;width:16%;transform:translateX(-50%);pointer-events:none;animation:gemFloat 2.4s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--gemc,#5ee05a))}
#gem svg{display:block;width:100%;aspect-ratio:40/70;animation:gemSpin 2.8s linear infinite}
@keyframes gemFloat{50%{transform:translate(-50%,-10%)}}
@keyframes gemSpin{0%{transform:scaleX(1)}25%{transform:scaleX(.18)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.18)}100%{transform:scaleX(1)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
#cat.walk #catInner{animation:hop .3s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-5%) rotate(-2deg)}}
#cat.eat #catInner{animation:nom .45s ease-in-out infinite}
@keyframes nom{50%{transform:translateY(3%) rotate(4deg) scale(1.02,.97)}}
#cat.happy #catInner{animation:jump .55s ease-out 2}
@keyframes jump{30%{transform:translateY(-18%) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.94)}}
#cat.wiggle #catInner{animation:wig .25s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#cat.held{transition:none;z-index:30}
#cat.held #catInner{animation:dangle .6s ease-in-out infinite;transform-origin:50% 0}
@keyframes dangle{50%{transform:rotate(5deg)}}
#cat.sleep #catInner{animation:sleepb 4s ease-in-out infinite}
#cat.sleep #gem{display:none}
@keyframes sleepb{50%{transform:scale(1.02,1.035)}}
#cat.flip #catImg,#cat.flip .lid{scale:-1 1}
#cat.flip #lidL{left:43.9%}#cat.flip #lidR{left:17.8%}
#cat.angry #catInner{animation:shake .12s linear 6}
@keyframes shake{25%{transform:translateX(-4%)}75%{transform:translateX(4%)}}

/* thought / speech */
#bubble{position:absolute;z-index:20;background:#fff;color:#1b2b45;border-radius:22px;padding:9px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px #0005;max-width:64%;transform:translate(-50%,-100%) scale(0);transform-origin:50% 100%;transition:transform .25s cubic-bezier(.3,1.6,.6,1);pointer-events:none;text-align:center;border:2px solid #e9eef7}
#bubble.show{transform:translate(-50%,-100%) scale(1)}
#bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.think{border-radius:40px}
#bubble.think::after{border:none;width:12px;height:12px;border-radius:50%;background:#fff;bottom:-16px;margin-left:-14px;box-shadow:-8px 12px 0 -2px #fff}
#bubble .big{font-size:30px;display:block;line-height:1.1}

#tut{position:absolute;top:8px;right:8px;max-width:72%;background:linear-gradient(135deg,#0e2240ee,#1d4a80ee);border:1px solid #d9b25f;color:#fff;border-radius:14px;padding:7px 11px;font-size:13px;font-weight:600;z-index:22;box-shadow:0 4px 12px #0006;display:none}
#tut b{display:block;font-size:11px;color:var(--gold2);font-weight:700}
#notif{position:absolute;top:8px;left:50%;transform:translate(-50%,-140%);min-width:60%;max-width:90%;background:linear-gradient(135deg,#0e2240f2,#1d4a80f2);border:1px solid var(--gold);color:#fff;padding:9px 14px;border-radius:16px;font-weight:700;z-index:60;transition:transform .35s cubic-bezier(.3,1.4,.6,1);pointer-events:none;text-align:center;box-shadow:0 8px 20px #0007;font-size:15px}
#notif.show{transform:translate(-50%,0)}
.fx{position:absolute;pointer-events:none;z-index:25;font-size:24px;animation:floatUp 1.4s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(calc(-50% + var(--dx,0px)),-110px) scale(.9);opacity:0}}
.zzz{position:absolute;z-index:14;pointer-events:none;font-weight:800;color:#dfe8ff;text-shadow:0 0 8px #7aa2ff;animation:zz 2.4s ease-out forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-40px,-90px) scale(1.5)}}

/* pie menu */
#pie{position:absolute;inset:0;z-index:50;display:none}
#pie.open{display:block}
#pieCenter{position:absolute;transform:translate(-50%,-50%);background:#0e2240e6;border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px #0007}
.pieBtn{position:absolute;transform:translate(-50%,-50%) scale(.3);opacity:0;border:1px solid #cfe9ff88;border-radius:22px;padding:8px 14px;min-width:96px;background:linear-gradient(180deg,#3d79c0,#1b4683);font-size:14px;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 #ffffff55,0 5px 14px #0008;white-space:nowrap;transition:transform .22s cubic-bezier(.3,1.5,.6,1),opacity .2s;text-align:center;line-height:1.15}
.pieBtn small{display:block;font-size:10px;font-weight:500;color:#d4e6ff}
#pie.open .pieBtn{transform:translate(-50%,-50%) scale(1);opacity:1}
.pieBtn:active{background:linear-gradient(180deg,#58a0ee,#2a62ad)}
.pieBtn[disabled]{filter:grayscale(.8);opacity:.6!important}

/* ---------- HUD ---------- */
#hud{background:linear-gradient(180deg,#132d52,#0b1b34);border-top:1px solid #d9b25f88;padding:8px 10px 6px;box-shadow:0 -6px 18px #0006;position:relative;z-index:40}
#hudTop{display:flex;align-items:center;gap:10px}
#portrait{position:relative;width:58px;height:58px;flex:0 0 auto}
#portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 0 3px #0e2240,0 0 14px var(--gemc,#5ee05a)}
#pGem{position:absolute;top:-12px;left:50%;width:16px;transform:translateX(-50%);filter:drop-shadow(0 0 5px var(--gemc,#5ee05a))}
#pGem svg{width:100%;display:block;animation:gemSpin 2.8s linear infinite}
#moodBox{flex:1;min-width:0}
#catName{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#moodText{font-size:13px;font-weight:700;color:var(--gemc,#5ee05a)}
#moodlets{display:flex;gap:4px;margin-top:3px;flex-wrap:nowrap;overflow:hidden}
.ml{font-size:13px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;border:1px solid}
.ml.p{background:#1f5a2c;border-color:#5ee05a88}.ml.n{background:#5a1f24;border-color:#ff4d4d88}
#wallet{text-align:left;flex:0 0 auto}
#coins{font-size:18px;font-weight:800;color:var(--gold2)}
#lvl{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
#xpBar{width:84px;height:5px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-top:3px}
#xpFill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .4s}
#needs{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:8px}
.need{display:flex;align-items:center;gap:6px}
.need .nl{font-size:12px;font-weight:600;width:62px;white-space:nowrap;color:#dce9fb}
.need .bar{flex:1;height:11px;border-radius:9px;background:#071224;box-shadow:inset 0 1px 3px #000c;overflow:hidden;border:1px solid #ffffff1a}
.need .fill{height:100%;border-radius:9px;transition:width .6s,background .6s;position:relative}
.need .fill::after{content:"";position:absolute;left:0;right:0;top:1px;height:40%;border-radius:9px;background:#ffffff55}
.need.low .bar{animation:lowp 1s infinite}
@keyframes lowp{50%{box-shadow:0 0 0 2px #ff4d4d99}}
#rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 10px 8px;background:#0b1b34}
.room{border:1px solid #d9b25f55;border-radius:12px;background:linear-gradient(180deg,#1b3b66,#10284a);padding:5px 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;position:relative}
.room .e{font-size:20px;line-height:1.2}
.room.on{border-color:var(--gold);color:#fff;background:linear-gradient(180deg,#3366a6,#1b4683);box-shadow:0 0 12px #6fe0ff44}
.room .dot{position:absolute;top:3px;left:6px;width:9px;height:9px;border-radius:50%;background:var(--bad);display:none;box-shadow:0 0 6px var(--bad)}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:#020818aa;display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.open{display:flex}
.sheet{background:linear-gradient(180deg,#16355f,#0c1d38);border:1px solid var(--gold);border-bottom:none;width:100%;max-width:520px;max-height:86%;border-radius:22px 22px 0 0;padding:16px;overflow:auto;animation:up .25s ease-out;box-shadow:0 -10px 30px #0008}
.center .sheet{border-radius:22px;border-bottom:1px solid var(--gold);align-self:center;width:90%;animation:pop .3s cubic-bezier(.3,1.5,.6,1)}
@keyframes up{from{transform:translateY(60%)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.sheet h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--gold2)}
.x{border:1px solid #ffffff33;background:#ffffff14;border-radius:50%;width:34px;height:34px;font-size:15px;flex:0 0 auto}
.mission{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:14px;padding:10px;margin-bottom:8px}
.mission .e{font-size:28px}
.mission .t{flex:1;font-weight:600;font-size:14px}
.mission .p{height:7px;background:#071224;border-radius:9px;overflow:hidden;margin-top:6px}
.mission .p i{display:block;height:100%;background:linear-gradient(90deg,#3fbf3b,#8ef07a)}
.mission .r{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
.btn{border:1px solid #fff6;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;background:linear-gradient(180deg,#5cd65a,#2f9a2d);color:#fff;box-shadow:inset 0 1px 0 #ffffff66,0 3px 0 #1d6a1c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d6a1c}
.btn.blue{background:linear-gradient(180deg,#4b8fdc,#1f4f93);box-shadow:inset 0 1px 0 #ffffff66,0 3px 0 #123463}
.btn.gray{background:linear-gradient(180deg,#5d6b80,#3b475a);box-shadow:inset 0 1px 0 #ffffff33,0 3px 0 #252e3c}
.btn.gold{background:linear-gradient(180deg,#f6d27a,#c4912c);color:#3a2604;box-shadow:inset 0 1px 0 #fff9,0 3px 0 #8a6012}
.btn.small{padding:7px 11px;font-size:13px}
.btn[disabled]{opacity:.45}
.done{color:var(--good);font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.item{background:linear-gradient(180deg,#ffffff12,#ffffff06);border:1px solid #ffffff22;border-radius:16px;padding:10px;text-align:center;font-size:14px;font-weight:700}
.item .e{font-size:38px;line-height:1.2}
.item .d{font-size:11px;color:var(--muted);font-weight:500;margin:3px 0 7px;min-height:28px}
.item .btn{width:100%;padding:7px}
.tabsRow{display:flex;gap:6px;margin-bottom:12px}
.tabsRow .btn{flex:1}
.sub{font-weight:700;margin:16px 0 8px;color:var(--gold2);font-size:14px}
input[type=text]{width:100%;font-size:20px;padding:11px 12px;border-radius:12px;border:1px solid var(--gold);background:#071224;color:#fff;font-family:inherit;text-align:center;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
.photo{width:100%;border-radius:16px;display:block;border:3px solid var(--gold);box-shadow:0 6px 18px #0008}
.statsList div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff14;font-weight:500}
.muted{color:var(--muted);font-size:13px}

/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:#0b1b34}
#game.open{display:flex}
#gHud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff;font-weight:800;font-size:18px;background:linear-gradient(180deg,#132d52,#0b1b34);border-bottom:1px solid var(--gold)}
#gArea{position:relative;flex:1;overflow:hidden;touch-action:none}
#gHint{position:absolute;top:10px;left:0;right:0;text-align:center;color:#fffc;font-weight:600;pointer-events:none;text-shadow:0 1px 3px #000}
.laserDot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(#fff 0 20%,#ff1a1a 45%,#ff000000 72%);box-shadow:0 0 18px 6px #ff000088;pointer-events:none}
.miniCat{position:absolute;height:120px;aspect-ratio:611/1100;margin:-120px 0 0 -33px;pointer-events:none}
.miniCat img{width:100%;height:100%}
.hole{position:absolute;width:26%;aspect-ratio:1.6;border-radius:50%;background:radial-gradient(#1a120e 55%,#5b3d2b 60%,#7a5238 70%);overflow:hidden}
.mouse{position:absolute;left:0;right:0;bottom:-100%;text-align:center;font-size:52px;transition:bottom .15s;line-height:1.15}
.mouse.up{bottom:0}
.mouse.hit{transform:scale(1.3) rotate(20deg);opacity:.4}
#gArea.mice{background:radial-gradient(circle at 50% 40%,#7cbf5a,#3f7a2c)}
#gArea.laser{background:repeating-linear-gradient(90deg,#6b4a32 0 46px,#5e4029 46px 48px)}
#gArea.laser::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#0000 20%,#000a)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="queue"><div id="qRing"><div id="qIcon">😺</div></div><div id="qText"><div id="qLabel">פנוי</div><div id="clock"></div></div></div>
    <button class="tbtn" id="missionsBtn" title="משימות">🏆<span class="badge" id="mBadge"></span></button>
    <button class="tbtn" id="shopBtn" title="קנייה">🛍️</button>
    <button class="tbtn" id="menuBtn" title="הגדרות">⚙️</button>
  </div>
  <div id="scene">
    <div id="stage">
      <svg id="back" viewBox="0 0 400 500"></svg>
      <div id="cat"><div id="catInner"><div class="shadow"></div><img id="catImg" src="cat.webp" alt=""><div class="lid" id="lidL"></div><div class="lid" id="lidR"></div><span id="acc"></span><div id="gem"></div></div></div>
      <svg id="front" viewBox="0 0 400 500"></svg>
    </div>
    <div id="light"></div>
    <div id="dark"></div>
    <div id="bubble"></div>
    <div id="tut"></div>
    <div id="notif"></div>
    <div id="pie"></div>
  </div>
  <div id="hud">
    <div id="hudTop">
      <div id="portrait"><img src="face.jpg" alt=""><div id="pGem"></div></div>
      <div id="moodBox"><div id="catName">החתול שלי</div><div id="moodText">מאושר</div><div id="moodlets"></div></div>
      <div id="wallet"><div id="coins"></div><div id="lvl">רמה 1</div><div id="xpBar"><div id="xpFill"></div></div></div>
    </div>
    <div id="needs"></div>
  </div>
  <div id="rooms">
    <button class="room" data-room="living"><span class="e">🛋️</span>סלון<i class="dot"></i></button>
    <button class="room" data-room="kitchen"><span class="e">🍽️</span>מטבח<i class="dot"></i></button>
    <button class="room" data-room="bedroom"><span class="e">🛏️</span>חדר שינה<i class="dot"></i></button>
    <button class="room" data-room="bath"><span class="e">🛁</span>חדר רחצה<i class="dot"></i></button>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="game">
  <div id="gHud"><span id="gScore">0</span><span id="gTitle"></span><span id="gTime">⏱ 25</span></div>
  <div id="gArea"><div id="gHint"></div></div>
</div>

<script>
"use strict";
const COIN='<i class="coin"></i>';
/* ================= data ================= */

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC;}
function tone(freq,dur,type='sine',vol=.15,slideTo){
  if(!S.sound) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function meow(sad){
  if(!S.sound) return; const a=ac(); if(!a) return;
  const t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
  o.type='sawtooth'; const base=sad?420:560;
  o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.6,t+.18);o.frequency.linearRampToValueAtTime(base*(sad?.75:1.05),t+.55);
  f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(1700,t+.2);f.frequency.linearRampToValueAtTime(900,t+.55);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.06);g.gain.linearRampToValueAtTime(.25,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+.6);
  o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.65);
}
let purrNode=null;
function purr(on){
  const a=S.sound&&ac(); if(!a) return;
  if(on&&!purrNode){
    const len=a.sampleRate*2,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++){const ph=(i/a.sampleRate)*26%1;d[i]=(Math.random()*2-1)*(ph<.45?1:.15);}
    const src=a.createBufferSource();src.buffer=buf;src.loop=true;
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=180;
    const g=a.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.5,a.currentTime+.3);
    src.connect(f).connect(g).connect(a.destination);src.start();purrNode={src,g};
  }else if(!on&&purrNode){const p=purrNode;purrNode=null;p.g.gain.linearRampToValueAtTime(0,a.currentTime+.4);setTimeout(()=>{try{p.src.stop();}catch(e){}},500);}
}

function wallShell(o){
  // o: {wall, pattern, panel, trim, floor:(svg)}
  const rail=110, base=12;
  const railL=[[50,290-rail],P(-1,0.55).map((v,i)=>i?v-rail*sc(.55):v)], railR=[[350,290-rail],P(1,0.55).map((v,i)=>i?v-rail*sc(.55):v)];
  const baseL=[[50,290-base],P(-1,0.55).map((v,i)=>i?v-base*sc(.55):v)], baseR=[[350,290-base],P(1,0.55).map((v,i)=>i?v-base*sc(.55):v)];
  let s=`<rect x="-400" y="-600" width="1200" height="1400" fill="${o.wall}"/>`;
  s+=`<rect x="50" y="-600" width="300" height="890" fill="${o.wall}"/>`;
  if(o.pattern) s+=`<rect x="-400" y="-600" width="1200" height="890" fill="url(#${o.pattern})"/>`;
  // wainscot panels on back wall
  if(o.panel){
    s+=`<rect x="50" y="${290-rail}" width="300" height="${rail}" fill="${o.panel}"/>`;
    for(let x=58;x<340;x+=48) s+=`<rect x="${x}" y="${290-rail+12}" width="40" height="${rail-30}" rx="2" fill="none" stroke="${o.trim}" stroke-width="1.4" opacity=".8"/>`;
  }
  s+=o.floor;
  // side walls
  const L=`50,-600 50,290 ${P(-1,0.55).join(',')} ${P(-1,0.55)[0]},-1600`, R=`350,-600 350,290 ${P(1,0.55).join(',')} ${P(1,0.55)[0]},-1600`;
  s+=`<polygon points="${L}" fill="${o.wall}"/>`+(o.pattern?`<polygon points="${L}" fill="url(#${o.pattern})"/>`:'');
  if(o.panel) s+=`<polygon points="50,${290-rail} 50,290 ${P(-1,.55).join(',')} ${railL[1].join(',')}" fill="${o.panel}"/>`;
  s+=`<polygon points="${L}" fill="url(#gSideL)"/>`;
  s+=`<polygon points="${R}" fill="${o.wall}"/>`+(o.pattern?`<polygon points="${R}" fill="url(#${o.pattern})"/>`:'');
  if(o.panel) s+=`<polygon points="350,${290-rail} 350,290 ${P(1,.55).join(',')} ${railR[1].join(',')}" fill="${o.panel}"/>`;
  s+=`<polygon points="${R}" fill="url(#gSideR)"/>`;
  // trims: chair rail + baseboard + corners
  const tr=o.trim||'#d9b25f';
  if(o.panel){s+=`<line x1="50" y1="${290-rail}" x2="350" y2="${290-rail}" stroke="${tr}" stroke-width="3"/><polyline points="${pts(railL)}" fill="none" stroke="${tr}" stroke-width="3"/><polyline points="${pts(railR)}" fill="none" stroke="${tr}" stroke-width="3"/>`;}

function floorCheck(c1,c2,step=.25){
  let s='';const zs=[];for(let z=2;z>.55;z-=.16)zs.push(z);
  for(let i=0;i<zs.length-1;i++)for(let u=-1,k=0;u<1-1e-6;u+=step,k++) s+=`<polygon points="${floorPoly(u,u+step,zs[i],zs[i+1])}" fill="${(i+k)%2?c1:c2}"/>`;
  return s+`<polygon points="${floorPoly(-1,1,2,.55)}" fill="url(#gShine)"/>`;
}
function floorPlanks(cols,step=.125){
  let s=`<polygon points="${floorPoly(-1,1,2,.55)}" fill="${cols[0]}"/>`;let k=0;
  for(let u=-1;u<1-1e-6;u+=step,k++){
    let z=2,j=k*7;
    while(z>.55){const len=.28+((j*37)%10)/40;const z2=Math.max(.55,z-len);s+=`<polygon points="${floorPoly(u,u+step,z,z2)}" fill="${cols[(j++)%cols.length]}" stroke="#0002" stroke-width=".6"/>`;z=z2;}
  }
  return s+`<polygon points="${floorPoly(-1,1,2,.55)}" fill="url(#gShine)"/>`;
}

const CAT_H=108; // cat height (units) at the back wall
let cat={u:0,z:1.35,lift:0};
function placeCat(u,z,opts={}){
  const c=$('cat');const [x,y]=P(u,z);const h=CAT_H*sc(z)*(opts.scale||1);const lift=opts.lift||0;
  if(opts.instant){c.style.transition='none';}
  c.classList.toggle('flip',!!opts.flip);
  c.style.left=(x/4)+'%'; c.style.bottom=((500-y+lift)/5)+'%'; c.style.height=(h/5)+'%';
  if(opts.instant){void c.offsetWidth;c.style.transition='';}
  cat={u,z,lift};
  setTimeout(sizeCat,opts.instant?0:950);
}
function walkTo(u,z,cb,opts={}){
  const c=$('cat');
  const [x0]=P(cat.u,cat.z),[x1]=P(u,z);
  if(Math.abs(x1-x0)<4&&Math.abs(z-cat.z)<.03&&!opts.lift){placeCat(u,z,opts);cb&&setTimeout(cb,50);return;}
  c.classList.add('walk');
  placeCat(u,z,Object.assign({flip:x1>x0},opts));
  setTimeout(()=>{c.classList.remove('walk','flip');cb&&cb();},920);
}
function goHome(cb){const [u,z]=ROOMS[room].home;walkTo(u,z,cb);}
function sizeCat(){const w=$('cat').getBoundingClientRect().width||100;$('acc').style.fontSize=(w*(S.acc?ACCS[S.acc].s:.3))+'px';}
function renderAcc(){

function mood(){
  const v={hunger:S.hunger,energy:S.energy,fun:S.fun,clean:S.clean,social:S.social,env:env()};
  const avg=Object.values(v).reduce((a,b)=>a+b,0)/6, min=Math.min(...Object.values(v));
  const score=avg-(min<20?18:min<35?8:0);
  let text,col;
  if(S.sleeping){text='ישן בשקט 😴';col='#7aa2ff';}
  else if(S.hunger<25){text='רעב מאוד';col='#ff4d4d';}
  else if(S.energy<20){text='מותש';col='#ff4d4d';}
  else if(score>=80){text='מאושר מאוד 😻';col='#5ee05a';}
  else if(score>=62){text='שמח';col='#5ee05a';}
  else if(score>=45){text='רגוע';col='#c6e04f';}
  else if(score>=30){text='לא מרוצה';col='#ffcf3a';}
  else {text='אומלל';col='#ff4d4d';}
  return {text,col,score};
}

const xpNeed=l=>40+l*30;
function addXP(n){
  S.xp+=n;
  while(S.xp>=xpNeed(S.level)){
    S.xp-=xpNeed(S.level);S.level++;S.coins+=25;sfx.level();
    setTimeout(()=>{toast(`🎉 עלית לרמה ${S.level}! +25 ${COIN}`,2800);const [x,y]=catPoint(.5,.2);fx('⭐',x,y,6);},300);
    const un=[...Object.values(ACCS),...Object.values(UPGRADES)].filter(a=>a.lvl===S.level);
    if(un.length)setTimeout(()=>toast(`🔓 נפתח בקנייה: ${un.map(a=>a.e).join(' ')}`,2600),3200);
  }
  renderStats();
}
function addCoins(n){S.coins+=n;S.total.coins+=n;sfx.coin();renderStats();}
function missionDef(id){return MISSIONS.find(m=>m.id===id);}
function ensureDay(){
  const t=todayStr();
  if(S.day&&S.day.date===t)return;
  let seed=[...t].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);const pool=MISSIONS.map(m=>m.id);const pick=[];
  while(pick.length<3){seed=(seed*1103515245+12345)&0x7fffffff;pick.push(pool.splice(seed%pool.length,1)[0]);}
  const y=new Date();y.setDate(y.getDate()-1);
  const yStr=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=S.lastDay===yStr?S.streak+1:1;S.lastDay=t;
  S.day={date:t,m:pick.map(id=>({id,p:0,c:false})),bonus:false};
}
function track(key,amount=1){
  ensureDay();
  for(const m of S.day.m){const d=missionDef(m.id);if(!d||d.key!==key||m.c)continue;
    const before=m.p;m.p=d.max?Math.max(m.p,amount):m.p+amount;m.p=Math.min(m.p,d.goal);
    if(before<d.goal&&m.p>=d.goal){setTimeout(()=>toast(`✅ משימה הושלמה: ${d.t(S.name)}`,2400),400);sfx.chime();}
  }
  const tu=TUTORIAL[S.tut];
  if(tu&&tu.key===key){S.tutProg+=amount;if(S.tutProg>=tu.goal){S.tut++;S.tutProg=0;addCoins(10);addXP(10);setTimeout(()=>toast(`🎓 כל הכבוד! +10 ${COIN}`),900);}}
  renderStats();
}
function renderTut(){
  const tu=TUTORIAL[S.tut],el=$('tut');
  if(!tu||!S.name){el.style.display='none';return;}
  el.style.display='block';el.innerHTML=`<b>משימת פתיחה ${S.tut+1}/${TUTORIAL.length}</b>${tu.t(S.name)}${tu.goal>1?` (${S.tutProg}/${tu.goal})`:''}`;
}

function openPie(obj,e){
  ac();

/* ---------- touch on cat: tap = pie menu, rub = pet, long-press = pick up ---------- */
(function(){
  const c=$('cat');let down=null,lastX=0,lastY=0,dist=0,lpTimer=null,held=false,strokes=0;
  c.addEventListener('pointerdown',e=>{
    ac();if(busy&&!S.sleeping)return;
    down={x:e.clientX,y:e.clientY,t:Date.now()};lastX=e.clientX;lastY=e.clientY;dist=0;
    c.setPointerCapture(e.pointerId);
    if(!S.sleeping)lpTimer=setTimeout(()=>{held=true;c.classList.add('held');meow();vibrate(40);say('הופה! 🙀',1200);},450);
  });
  c.addEventListener('pointermove',e=>{
    if(!down)return;const d=Math.hypot(e.clientX-lastX,e.clientY-lastY);
    if(held){const st=$('stage').getBoundingClientRect();const x=clamp((e.clientX-st.left)/st.width,.06,.94);c.style.left=(x*100)+'%';c.style.bottom=clamp((st.bottom-e.clientY)/st.height*100-25,2,70)+'%';return;}
    if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)clearTimeout(lpTimer);
    dist+=d;lastX=e.clientX;lastY=e.clientY;
    if(dist>55){dist=0;stroke(e);}
  });
  const end=e=>{
    clearTimeout(lpTimer);if(!down)return;
    if(held){held=false;c.classList.remove('held');dropCat(e);}
    else if(Date.now()-down.t<350&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<10)openPie('cat',e);
    down=null;if(strokes)purr(false);strokes=0;
  };
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  function stroke(e){
    const sr=$('scene').getBoundingClientRect(),x=e.clientX-sr.left,y=e.clientY-sr.top;
    if(S.sleeping){fx('💤',x,y);return;}
    strokes++;
    fx(Math.random()<.7?'💕':'💗',x,y);S.fun=clamp(S.fun+1);S.social=clamp(S.social+1.5);S.total.pet++;track('pet');mark('pet');if(strokes%5===0)addXP(1);
    if(strokes===3){purr(true);say(['פררררר 😽','עוד... 🥰','שם בדיוק!'][Math.random()*3|0]);c.classList.add('closed');setTimeout(()=>c.classList.remove('closed'),1600);}
    vibrate(8);renderStats();
  }
  function dropCat(e){
    if(room==='bedroom'){
      const bed=$('back').querySelector('[data-obj=bed]');
      if(bed){const b=bed.getBoundingClientRect();if(e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top-40&&e.clientY<b.bottom+40){
        if(S.energy>=90)say('אני לא עייף! 😼');else{placeCat(cat.u,cat.z,{instant:true});goSleep();return;}}}
    }
    const st=$('stage').getBoundingClientRect();const fxp=(e.clientX-st.left)/st.width*400;
    const z=cat.z,u=clamp((fxp-200)*z/300,-.85,.85);
    placeCat(u,z);meow();anim('happy',600);
  }
})();

/* ================= mini games ================= */
let G=null;
function startGame(type){
  if(busy||S.sleeping)return;
  if(S.energy<15){think('🛏️','אני עייף מדי לשחק... תשכיב אותי לישון');return;}
  const g=$('game'),area=$('gArea');g.classList.add('open');area.className=type;area.innerHTML='<div id="gHint"></div>';
  G={type,score:0,time:25,iv:null,raf:null,end:false};
  $('gTitle').textContent=type==='laser'?'🔴 לייזר':'🐭 צייד עכברים';
  $('gScore').textContent='⭐ 0';$('gTime').textContent='⏱ 25';
  G.iv=setInterval(()=>{G.time--;$('gTime').textContent='⏱ '+G.time;if(G.time<=0)endGame();},1000);
  if(type==='laser')laserGame(area);else miceGame(area);
}
function gScore(n){G.score=Math.max(0,G.score+n);$('gScore').textContent='⭐ '+G.score;}
function laserGame(area){
  $('gHint').textContent='גרור את האצבע – תן לחתול לתפוס את הנקודה!';
  const W=area.clientWidth,H=area.clientHeight;
  const dot=document.createElement('div');dot.className='laserDot';area.appendChild(dot);
  const cat=document.createElement('div');cat.className='miniCat';cat.innerHTML='<img src="cat.webp">';area.appendChild(cat);
  let dx=W*.5,dy=H*.3,cx=W*.5,cy=H*.85,moved=0,cool=0,lx=dx,ly=dy;
  const mv=e=>{const r=area.getBoundingClientRect();const nx=e.clientX-r.left,ny=e.clientY-r.top;moved+=Math.hypot(nx-lx,ny-ly);lx=nx;ly=ny;dx=nx;dy=ny;};
  area.onpointerdown=mv;area.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')mv(e);};
  let lt=performance.now();
  const step=t=>{if(G.end)return;const dt=Math.min(50,t-lt);lt=t;
    const sp=(.16+Math.min(.12,G.score*.008))*dt;const vx=dx-cx,vy=(dy+60)-cy,d=Math.hypot(vx,vy);
    if(d>4){cx+=vx/d*Math.min(sp,d);cy+=vy/d*Math.min(sp,d);}
    cat.style.left=cx+'px';cat.style.top=cy+'px';cat.style.transform=`scaleX(${vx>0?-1:1}) rotate(${Math.sin(t/80)*(d>10?6:0)}deg)`;
    dot.style.left=dx+'px';dot.style.top=dy+'px';
    if(cool>0)cool-=dt;
    if(d<40&&cool<=0&&moved>120){gScore(1);moved=0;cool=600;sfx.pop();vibrate(20);
      const p=document.createElement('div');p.className='fx';p.textContent='💥';p.style.left=dx+'px';p.style.top=dy+'px';area.appendChild(p);setTimeout(()=>p.remove(),1400);}
    G.raf=requestAnimationFrame(step);};
  G.raf=requestAnimationFrame(step);
}
function miceGame(area){
  $('gHint').textContent='הקש על העכברים 🐭 – לא על הכלב 🐶!';
  const holes=[];
  for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.style.left=(5+(i%3)*32)+'%';h.style.top=(12+Math.floor(i/3)*27)+'%';
    const m=document.createElement('div');m.className='mouse';h.appendChild(m);area.appendChild(h);holes.push(m);
    h.addEventListener('pointerdown',()=>{if(!m.classList.contains('up')||m.dataset.hit)return;m.dataset.hit=1;m.classList.add('hit');
      const k=m.dataset.k;if(k==='dog'){gScore(-2);sfx.bad();vibrate(120);}else{gScore(k==='cheese'?2:1);sfx.pop();vibrate(15);}
      setTimeout(()=>m.classList.remove('up'),120);});}
  const spawn=()=>{if(G.end)return;
    const free=holes.filter(m=>!m.classList.contains('up'));if(free.length){const m=free[Math.random()*free.length|0];
      const r=Math.random();m.dataset.k=r<.12?'dog':r<.25?'cheese':'mouse';m.textContent=m.dataset.k==='dog'?'🐶':m.dataset.k==='cheese'?'🐀':'🐭';
      delete m.dataset.hit;m.classList.remove('hit');m.classList.add('up');const life=Math.max(550,1100-G.score*25);
      setTimeout(()=>m.classList.remove('up'),life);}
    G.raf=setTimeout(spawn,Math.max(380,750-G.score*15));};
  spawn();
}
function endGame(quit){
  if(!G||G.end)return;G.end=true;clearInterval(G.iv);cancelAnimationFrame(G.raf);clearTimeout(G.raf);
  const type=G.type,score=G.score;$('game').classList.remove('open');G=null;
  if(quit)return;
  const coins=Math.max(2,score);
  S.fun=clamp(S.fun+18+Math.min(12,score));S.energy=clamp(S.energy-12);S.hunger=clamp(S.hunger-6);S.social=clamp(S.social+8);
  S.total.games++;mark('play');track('games');if(type==='laser'){track('laser');S.bestLaser=Math.max(S.bestLaser,score);}else{track('miceBest',score);S.bestMice=Math.max(S.bestMice,score);}
  addCoins(coins);addXP(8+score);
  openModal(`<div style="text-align:center"><div style="font-size:56px">${score>=10?'🏆':score>=5?'😸':'🙂'}</div>
    <h2 style="justify-content:center">כל הכבוד!</h2><div style="font-size:18px;font-weight:700;margin-bottom:6px">ניקוד: ${score}</div>
    <div class="muted">+${coins} ${COIN} &nbsp; +כיף 🎾 &nbsp; +חברה 💕 &nbsp; −אנרגיה ⚡</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="closeModal();startGame('${type}')">שוב! 🔁</button><button class="btn gray" onclick="closeModal()">סיום</button></div></div>`,true);
  anim('happy',1200);meow();save();
}

/* ================= modals ================= */
function openModal(html,center){const m=$('modal');m.className='modal open'+(center?' center':'');$('sheet').innerHTML=html;}
function closeModal(){$('modal').className='modal';}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&S.name)closeModal();});

function openMissions(){
  ensureDay();const n=S.name;
  let h=`<h2>🏆 משימות ושאיפות <button class="x" onclick="closeModal()">✕</button></h2><div class="muted" style="margin-bottom:12px">🔥 רצף ימים: ${S.streak} · משימות חדשות בכל יום</div>`;
  for(const m of S.day.m){const d=missionDef(m.id);if(!d)continue;const pct=Math.min(100,m.p/d.goal*100),ok=m.p>=d.goal;
    h+=`<div class="mission"><div class="e">${d.e}</div><div class="t">${d.t(n)}<div class="p"><i style="width:${pct}%"></i></div><div class="r">${m.p}/${d.goal} · פרס ${d.coins} ${COIN}</div></div>
      ${m.c?'<span class="done">✓ נאסף</span>':ok?`<button class="btn small gold" onclick="claim('${m.id}')">אסוף</button>`:''}</div>`;}
  h+=`<div class="mission" style="border-color:#d9b25f88;background:#d9b25f1a"><div class="e">🎁</div><div class="t">בונוס יומי · ${S.streak} ימים ברצף<div class="r">${10+S.streak*2} ${COIN}</div></div>${S.day.bonus?'<span class="done">✓ נאסף</span>':`<button class="btn small gold" onclick="claimBonus()">אסוף</button>`}</div>`;
  if(S.day.m.every(m=>m.c))h+=`<div style="text-align:center;font-weight:700;color:var(--good);margin-top:6px">כל המשימות הושלמו! ${n} גאה בך 😻</div>`;
  h+=`<div class="sub">🏅 הישגים</div><div class="statsList">
    <div><span>🍽️ ארוחות</span><span>${S.total.feed}</span></div><div><span>💕 ליטופים</span><span>${S.total.pet}</span></div>
    <div><span>🎮 משחקים</span><span>${S.total.games}</span></div><div><span>🐭 שיא עכברים</span><span>${S.bestMice}</span></div>
    <div><span>🔴 שיא לייזר</span><span>${S.bestLaser}</span></div></div>`;
  openModal(h);
}
function claim(id){const m=S.day.m.find(x=>x.id===id),d=missionDef(id);if(!m||m.c||m.p<d.goal)return;m.c=true;addCoins(d.coins);addXP(15);confetti();save();openMissions();}
function claimBonus(){if(S.day.bonus)return;S.day.bonus=true;addCoins(10+S.streak*2);addXP(5);confetti();track('mission');save();openMissions();}
function confetti(){const sr=$('scene').getBoundingClientRect();for(let i=0;i<14;i++)setTimeout(()=>fx(['🎉','⭐','✨','💎'][i%4],Math.random()*sr.width,sr.height*.6),i*40);}

function openShop(tab='food'){
  closePie();
  const T=(id,l)=>`<button class="btn small ${tab===id?'blue':'gray'}" onclick="openShop('${id}')">${l}</button>`;
  let h=`<h2>🛍️ קנייה <span style="font-size:16px">${COIN} ${S.coins}</span><button class="x" onclick="closeModal()">✕</button></h2><div class="tabsRow">${T('food','🍣 גורמה')}${T('home','🏰 לבית')}${T('acc','🎀 סטייל')}</div><div class="grid">`;
  const price=(p,ok,fn)=>`<button class="btn small gold" onclick="${fn}" ${ok?'':'disabled'}>${p} ${COIN}</button>`;
  if(tab==='food'){
    for(const [id,f] of Object.entries(FOODS)){if(f.free)continue;
      h+=`<div class="item"><div class="e">${f.e}</div>${f.name}<div class="d">+${f.hunger} שובע${f.fun?` · +${f.fun} כיף`:''}<br>במלאי: ${S.inv[id]||0}</div>${price(f.price,S.coins>=f.price,`buy('${id}')`)}</div>`;}
  }else if(tab==='home'){
    for(const [id,a] of Object.entries(UPGRADES)){const own=has(id),lock=S.level<a.lvl;
      h+=`<div class="item"><div class="e">${a.e}</div>${a.name}<div class="d">${a.d}</div>${own?'<span class="done">✓ מותקן</span>':lock?`<button class="btn small gray" disabled>🔒 רמה ${a.lvl}</button>`:price(a.price,S.coins>=a.price,`buyUpg('${id}')`)}</div>`;}
  }else{
    for(const [id,a] of Object.entries(ACCS)){const own=S.owned.includes(id),lock=S.level<a.lvl;
      h+=`<div class="item"><div class="e">${a.e}</div>${a.name}<div class="d">${own?(S.acc===id?'לבוש עכשיו':'בארון'):'אביזר'}</div>${lock?`<button class="btn small gray" disabled>🔒 רמה ${a.lvl}</button>`:own?`<button class="btn small ${S.acc===id?'gray':'blue'}" onclick="wear('${id}')">${S.acc===id?'להוריד':'ללבוש'}</button>`:price(a.price,S.coins>=a.price,`buyAcc('${id}')`)}</div>`;}
  }
  openModal(h+`</div><div class="muted" style="margin-top:14px;text-align:center">מרוויחים מטבעות ממשימות, משחקים וניקיון</div>`);
}
function buy(id){const f=FOODS[id];if(S.coins<f.price)return;S.coins-=f.price;S.inv[id]=(S.inv[id]||0)+1;sfx.coin();save();renderStats();openShop('food');}
function buyUpg(id){const a=UPGRADES[id];if(S.coins<a.price||S.level<a.lvl||has(id))return;S.coins-=a.price;S.upg.push(id);sfx.level();save();closeModal();setRoom(a.room);toast(`${a.e} ${a.name} הותקן!`);setTimeout(()=>say('וואו! איזה יופי 😻'),600);}
function buyAcc(id){const a=ACCS[id];if(S.coins<a.price||S.level<a.lvl)return;S.coins-=a.price;S.owned.push(id);S.acc=id;renderAcc();sfx.level();save();renderStats();openShop('acc');setTimeout(()=>say('איך אני נראה? 😎'),300);}
function wear(id){S.acc=S.acc===id?null:id;renderAcc();save();renderStats();openShop('acc');}
function openPhoto(){openModal(`<h2>🖼️ ${S.name} <button class="x" onclick="closeModal()">✕</button></h2><img class="photo" src="face.jpg"><div class="muted" style="text-align:center;margin-top:10px">הדיוקן הרשמי של בית המלוכה 👑</div>`);mark('play');S.fun=clamp(S.fun+2);}

function openMenu(){
  closePie();
  const days=Math.max(1,Math.ceil((Date.now()-S.created)/864e5));
  openModal(`<h2>⚙️ ${S.name} <button class="x" onclick="closeModal()">✕</button></h2>
    <img class="photo" src="face.jpg">
    <div class="statsList" style="margin-top:10px"><div><span>📅 ימים יחד</span><span>${days}</span></div><div><span>⭐ רמה</span><span>${S.level}</span></div><div><span>💰 מטבעות שהרווחת</span><span>${S.total.coins}</span></div></div>
    <div class="row"><span>🔊 צלילים</span><button class="btn small ${S.sound?'':'gray'}" onclick="S.sound=!S.sound;save();purr(false);openMenu()">${S.sound?'פועל':'כבוי'}</button></div>
    <div class="row"><span>✏️ שינוי שם</span><button class="btn small blue" onclick="askName()">שנה</button></div>
    <div class="row"><span style="color:var(--bad)">🔄 התחלה מחדש</span><button class="btn small gray" onclick="if(confirm('למחוק את כל ההתקדמות?')){localStorage.removeItem(KEY);location.reload();}">אפס</button></div>
    <div class="muted" style="margin-top:8px">טיפ: הקש על חפצים בחדר ועל החתול כדי לפתוח תפריט פעולות. העבר אצבע על החתול כדי ללטף, ולחיצה ארוכה מרימה אותו.</div>`);
}
function askName(){
  openModal(`<div style="text-align:center"><img src="face.jpg" style="width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 24px #5ee05a88"><h2 style="justify-content:center">${S.name?'שם חדש':'ברוך הבא לאחוזה 🏰'}</h2>
    <div class="muted" style="margin-bottom:12px">${S.name?'':'החתול שלך עבר לגור בבית חדש ויוקרתי. תדאג לכל הצרכים שלו – אוכל, שינה, כיף, ניקיון ואהבה.'}</div>
    <input type="text" id="nameIn" maxlength="14" placeholder="איך קוראים לו?" value="${S.name||''}">
    <button class="btn" style="width:100%;margin-top:12px" onclick="setName()">${S.name?'שמור':'בוא נתחיל 🐾'}</button></div>`,true);
  setTimeout(()=>$('nameIn').focus(),200);
}
function setName(){const v=$('nameIn').value.trim();if(!v){$('nameIn').style.borderColor='#ff4d4d';return;}const first=!S.name;S.name=v;closeModal();save();renderStats();
  if(first){setRoom('kitchen');setTimeout(()=>{meow();think('🍗',`מיאו! אני ${v} ואני רעב`);},500);setTimeout(()=>toast('💡 הקש על חפצים ועל החתול כדי לבחור פעולה',3500),4400);}}

/* ================= back button (called from Android) ================= */
window.handleBack=function(){
  if(G){endGame(true);return true;}
  if($('pie').classList.contains('open')){closePie();return true;}
  if($('modal').classList.contains('open')&&S.name){closeModal();return true;}
  return false;
};

/* ================= main loop ================= */
function simulate(sec){
  // elapsed-time progression; needs never drop below a floor – the cat never dies
  const h=sec/3600;
  if(S.sleeping){
    S.energy=clamp(S.energy+SLEEP_GAIN*sec*(has('canopy')?1.5:1));S.hunger=clamp(S.hunger-RATE.hunger/2*h,3);S.social=clamp(S.social-RATE.social/3*h,3);
    if(S.energy>=100)S.sleeping=false;
  }else{
    S.hunger=clamp(S.hunger-RATE.hunger*h,3);S.energy=clamp(S.energy-RATE.energy*h*(isNight()?1.6:1),3);
    S.fun=clamp(S.fun-RATE.fun*h*(S.hunger<20?1.5:1),3);S.social=clamp(S.social-RATE.social*h,3);
  }
  S.clean=clamp(S.clean-RATE.clean*h*(S.poop>=2?2:1),3);
  S.water=clamp(S.water-10*h,0);
  S.poopMeter+=h*6*(has('autoBox')?.6:1);if(S.poopMeter>=60){S.poopMeter=0;S.poop=Math.min(3,S.poop+1);}
}
let lastTick=Date.now(),saveCount=0,blinkT=0,hintCount=0;
function tick(){
  const now=Date.now(),sec=(now-lastTick)/1000;lastTick=now;
  const wasSleeping=S.sleeping;simulate(sec);
  if(wasSleeping&&!S.sleeping)wakeUp(false);
  if(S.sleeping&&room==='bedroom'&&Math.random()<.5){
    const [x,y]=catPoint(.75,.12);const z=document.createElement('div');z.className='zzz';z.textContent='Z';z.style.fontSize=(14+Math.random()*12)+'px';z.style.left=x+'px';z.style.top=y+'px';$('scene').appendChild(z);setTimeout(()=>z.remove(),2500);
  }
  if(S.hunger>80&&S.energy>80&&S.fun>80&&S.clean>80)track('allgood');
  renderStats();
  if(++hintCount%10===0)renderHints();
  if(!busy&&!G&&!S.sleeping&&S.name&&now-lastSpeak>15000&&!$('modal').classList.contains('open')&&!$('pie').classList.contains('open')){
    if(S.hunger<30){think('🍗','אני רעב! מיאו!');meow(true);}
    else if(S.energy<25)think('🛏️','אני עייף... תשכיב אותי לישון?');
    else if(S.poop>=2)think('🤢','הארגז מלוכלך!');
    else if(S.fun<30)think('🧶','משעמם לי! בוא נשחק');
    else if(S.social<30)think('💕','אני מרגיש בודד... תלטף אותי?');
    else if(S.water<20)think('💧','נגמרו לי המים');
    else if(Math.random()<.4)say(HAPPY_LINES[Math.random()*HAPPY_LINES.length|0]);
    else lastSpeak=now-7000;
  }
  if(!S.sleeping&&--blinkT<=0){blinkT=3+Math.random()*4|0;const c=$('cat');c.classList.add('blink');setTimeout(()=>c.classList.remove('blink'),160);}
  if(++saveCount%5===0)save();
}

/* ================= boot ================= */
load();
{const away=(Date.now()-S.last)/1000;if(away>5)simulate(away);}
ensureDay();
$('gem').innerHTML=gemSVG();$('pGem').innerHTML=gemSVG();
document.querySelectorAll('.room').forEach(t=>t.addEventListener('click',()=>{ac();setRoom(t.dataset.room);}));
$('missionsBtn').onclick=()=>{ac();closePie();openMissions();};
$('shopBtn').onclick=()=>{ac();openShop();};
$('menuBtn').onclick=()=>{ac();openMenu();};
$('portrait').onclick=()=>{ac();openMenu();};
document.addEventListener('visibilitychange',()=>{if(document.hidden){purr(false);save();}else{lastTick=Date.now();const away=(Date.now()-S.last)/1000;if(away>2)simulate(away);renderStats();}});
window.addEventListener('resize',layoutStage);
layoutStage();
setRoom(S.room||'kitchen',true);
renderAcc();renderStats();
setInterval(tick,1000);
if(!S.name)askName();
else setTimeout(()=>{if(S.sleeping)toast(`💤 ${S.name} ישן בחדר השינה`);else talk();},700);
document.fonts&&document.fonts.ready.then(()=>{layoutStage();renderStats();});
</script>
