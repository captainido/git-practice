plugins {
    id 'com.android.application'
}

android {
    namespace 'com.catgame.home'
    compileSdk 35

    defaultConfig {
        applicationId 'com.catgame.home'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file('cathome.keystore')
            storePassword 'cathome123'
            keyAlias 'cathome'
            keyPassword 'cathome123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
